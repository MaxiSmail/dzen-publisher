name: VK AI Channel Auto Publisher

on:
  schedule:
    # Запуск утренней публикации в 06:00 UTC (09:00 МСК)
    - cron: '0 6 * * *'
    # Запуск адаптации Дзена в 10:50 UTC (13:50 МСК)
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска: own_rss, dzen_adaptation или auto'
        required: true
        type: choice
        options:
          - auto
          - own_rss
          - dzen_adaptation
        default: auto

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests google-genai pydantic python-dotenv

      - name: Run VK Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cd "Программирование/Проект Автопостинг VK/scripts"
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -lt 10 ]; then
              MODE="own_rss"
            else
              MODE="dzen_adaptation"
            fi
          fi
          echo "Режим запуска VK: $MODE"
          python main.py --mode "$MODE"

      - name: Commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "chore: update vk posted history [skip ci]"
          file_pattern: "Программирование/Проект Автопостинг VK/scripts/posted_history.json"
